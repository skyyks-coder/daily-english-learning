<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Daily English Learning</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">

</head>

<body class="bg-gray-100 min-h-screen">

<div class="max-w-4xl mx-auto p-4">

<div class="bg-blue-600 text-white rounded-2xl shadow p-6 mb-6">
<h1 class="text-3xl font-bold">
Daily English Learning
</h1>

<p class="mt-2 opacity-90">
Today's Topic
</p>
</div>

<div class="bg-white rounded-2xl shadow p-5 mb-5">

<h2 id="articleTitle" class="text-2xl font-bold mb-3">
Loading...
</h2>

<div class="text-sm text-gray-500 mb-3">

Source :
<span id="articleSource"></span>

|

Date :
<span id="articleDate"></span>

</div>

<a
id="articleLink"
target="_blank"
class="text-blue-600 underline">

Read Original Article

</a>

<div
id="articleContent"
class="mt-5 text-gray-700 leading-8 whitespace-pre-line max-h-[800px] overflow-y-auto">
</div>

</div>

<div class="bg-white rounded-2xl shadow p-5 mb-5">

<h3 class="font-bold text-xl mb-3">
🎧 Listen Article
</h3>

<button
id="listenBtn"
class="w-full bg-blue-600 text-white p-3 rounded-xl">

Listen Article

</button>

</div>

<div class="bg-white rounded-2xl shadow p-5 mb-5">

<h3 class="font-bold text-xl mb-3">
🤖 AI Summary
</h3>

<div
id="summaryContent"
class="text-gray-700 leading-8 whitespace-pre-line">
</div>

<button
id="listenSummaryBtn"
class="mt-4 w-full bg-indigo-600 text-white p-3 rounded-xl">

Listen Summary

</button>

</div>

</div>

<script>

let article = {};

fetch("articles.json")
.then(response => response.json())
.then(data => {

    article = data[0];

    document.getElementById("articleTitle").textContent =
    article.title || "";

    document.getElementById("articleSource").textContent =
    article.source || "";

    document.getElementById("articleDate").textContent =
    article.date || "";

    document.getElementById("articleLink").href =
    article.url || "#";

    document.getElementById("articleContent").textContent =
    article.article || "";

    document.getElementById("summaryContent").textContent =
    article.summary || "";

})
.catch(error => {

    console.error(error);

    document.getElementById("articleTitle").textContent =
    "Unable to load article.";

});

document.getElementById("listenBtn")
.addEventListener("click", () => {

    if(!article.article) return;

    speechSynthesis.cancel();

    const speech =
    new SpeechSynthesisUtterance(article.article);

    speech.lang = "en-US";
    speech.rate = 0.9;

    speechSynthesis.speak(speech);

});

document.getElementById("listenSummaryBtn")
.addEventListener("click", () => {

    if(!article.summary) return;

    speechSynthesis.cancel();

    const speech =
    new SpeechSynthesisUtterance(article.summary);

    speech.lang = "en-US";
    speech.rate = 0.9;

    speechSynthesis.speak(speech);

});

if("serviceWorker" in navigator){

    navigator.serviceWorker.register(
    "service-worker.js"
    );

}

</script>

</body>
</html>
